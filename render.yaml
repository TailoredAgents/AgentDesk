# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Protected sample workspace plus an optional individually authenticated CRM pilot.
# CRM pilot variables are intentionally optional: set them in Render Environment
# only after following docs/LOFTY_SETUP.md. No new credentials are required to deploy.
# This file does not deploy anything by itself.
services:
  - type: web
    name: agentdesk
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run config:check && npm run db:migrate && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Keep the deployed text models in sync with the interactive default.
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: OPENAI_REWRITE_MODEL
        value: gpt-6.1-sol
      # Live model and saved-work flows validated; integrated into this service.
      - key: AGENTDESK_COPILOT_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentdesk-postgres
          property: connectionString
      - key: DEMO_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          name: agentdesk
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: agentdesk-postgres
    region: virginia
    plan: 0.1c-256mb
    databaseName: agentdesk
    user: agentdesk
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: []
